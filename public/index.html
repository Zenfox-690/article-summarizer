<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AI-Powered Article Summarizer using Google Gemini. Summarize long articles into concise, factual insights.">
  <title>AI Article Summarizer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-wrapper">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
        </div>
        <div class="header-text">
          <h1>AI Article Summarizer</h1>
          <p class="subtitle">Extract key insights and concise summaries in seconds</p>
        </div>
      </div>
      <span class="badge">Powered by Gemini 3.8 Flash</span>
    </header>

    <main class="main-content">
      <!-- Error notification banner -->
      <div id="error-banner" class="alert-banner hidden" role="alert" aria-live="assertive">
        <div class="alert-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
        </div>
        <div id="error-message" class="alert-text"></div>
        <button id="dismiss-error-btn" class="close-btn" type="button" aria-label="Dismiss error">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Input Card -->
      <section class="card input-card">
        <div class="card-header">
          <label for="article-input" class="card-title">Article Content</label>
          <div class="card-actions">
            <button id="sample-btn" type="button" class="btn btn-ghost" title="Load sample article text">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 20h9"></path>
                <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path>
              </svg>
              <span>Load Sample</span>
            </button>
            <button id="clear-btn" type="button" class="btn btn-ghost" title="Clear article text">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
              </svg>
              <span>Clear</span>
            </button>
          </div>
        </div>

        <div class="textarea-wrapper">
          <textarea
            id="article-input"
            rows="10"
            placeholder="Paste your article, essay, or document here to generate a concise summary..."
            aria-label="Article text"
            spellcheck="true"
          ></textarea>
        </div>

        <div id="input-error" class="validation-message hidden" role="alert" aria-live="polite"></div>

        <div class="card-footer">
          <div class="stats-counter" id="input-stats">
            <span id="input-word-count">0</span> words &bull; <span id="input-char-count">0</span> characters
          </div>
          <button id="summarize-btn" type="button" class="btn btn-primary">
            <span class="btn-spinner hidden" id="loading-spinner">
              <svg class="spinner-icon" viewBox="0 0 24 24">
                <circle class="spinner-track" cx="12" cy="12" r="10" fill="none" stroke-width="3"></circle>
                <circle class="spinner-head" cx="12" cy="12" r="10" fill="none" stroke-width="3"></circle>
              </svg>
            </span>
            <span id="btn-text">Summarize Article</span>
          </button>
        </div>
      </section>

      <!-- Summary Output Card -->
      <section id="summary-section" class="card output-card hidden" aria-live="polite">
        <div class="card-header">
          <div class="output-header-left">
            <h2 class="card-title">Generated Summary</h2>
            <span id="reduction-badge" class="reduction-badge"></span>
          </div>
          <div class="card-actions">
            <button id="copy-btn" type="button" class="btn btn-secondary" title="Copy summary to clipboard">
              <span id="copy-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
              </span>
              <span id="copy-text">Copy Summary</span>
            </button>
          </div>
        </div>

        <div class="summary-body" id="summary-content"></div>

        <div class="card-footer summary-footer">
          <div class="stats-counter" id="output-stats">
            <span id="output-word-count">0</span> words &bull; <span id="output-char-count">0</span> characters
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <p>AI Article Summarizer &bull; Built with FastAPI &amp; Google Gemini &bull; Hosted on Vercel</p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
